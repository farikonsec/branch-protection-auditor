name: Branch Protection Audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
    - name: Generate go.sum
      run: go mod tidy
    - name: Run auditor
      env:
        APP_ID: ${{ secrets.GH_APP_ID }}
        INSTALLATION_ID: ${{ secrets.GH_INSTALLATION_ID }}
        PRIVATE_KEY: ${{ secrets.GH_PRIVATE_KEY }}
      run: go run main.go
    - name: Upload branch protection report
      uses: actions/upload-artifact@v4
      with:
        name: branch-protection-report
        path: branch_protection_report.csv